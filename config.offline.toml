[core]
workspace_base = "./workspace"
file_store = "local"
file_store_path = "./file_store"
runtime = "local"               # ProcessSandboxService: Docker 없이 subprocess로 실행
enable_browser = false          # 브라우저 도구 비활성화

[llm]
# openai/ 접두사 + vLLM 모델 경로 그대로 사용 (슬래시 포함)
# 실제 IP:PORT 는 .env.offline 의 LLM_BASE_URL 로 지정
model = "openai//mnt/models/models/gpt-oss-120b"
base_url = "http://WORKSTATION_IP:PORT/v1"   # 실제 워크스테이션 IP:PORT 로 교체
api_key = "none"                # vLLM 인증 없음, 임의값 필요
temperature = 0.1
max_input_tokens = 65536
max_output_tokens = 65536
stream = false

[agent]
enable_browsing = false         # 인터넷 검색 비활성화

[condenser]
type = "noop"
